name: Github Actions

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # Needed to pull images from GitHub Container Registry
  pull-requests: read # Needed for PR metadata during labeling and documentation checks
  issues: read # Needed for issue metadata used by shared Ansys actions

env:
  MAIN_PYTHON_VERSION: "3.12"
  DOCUMENTATION_CNAME: "units.docs.pyansys.com"
  LIBRARY_NAME: "ansys-units"
  LIBRARY_NAMESPACE: "ansys.units"

jobs:
  code-style:
    name: "Code style"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/code-style@v11.0.2
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          skip-install: false

      - name: "Make venv"
        run: uv venv --clear

      - name: "Install basedpyright"
        run: uv tool install basedpyright

      - name: "Install extras"
        run: uv pip install -e ".[ci_types]"

      - name: "Check Type hints"
        run: basedpyright --baselinemode=auto

  doc-style:
    name: Documentation Style Check
    runs-on: ubuntu-latest
    steps:
      - name: "Running documentation style checks"
        uses: ansys/actions/doc-style@v11.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          vale-version: "3.4.1"

  check-vulnerabilities:
    name: "Check library vulnerabilities"
    runs-on: ubuntu-22.04
    steps:
      - uses: ansys/actions/check-vulnerabilities@main
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          python-package-name: ${{ env.LIBRARY_NAME }}
          dev-mode: ${{ github.ref != 'refs/heads/main' }}
          upload-reports: True
          hide-log: false
          bandit-configfile: "pyproject.toml"

  actions-security:
    name: "Actions Security"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/check-actions-security@0b23d99e6800f16337ff173fcfbfcc1251130e99 # v11.0.2
        with:
          generate-summary: true
          token: ${{ secrets.GITHUB_TOKEN }}
          auditing-level: "high"

  pr-name:
    if: github.event_name == 'pull_request'
    name: Check the name of the PR
    runs-on: ubuntu-latest
    steps:
      - name: Check commit name
        uses: ansys/actions/check-pr-title@0b23d99e6800f16337ff173fcfbfcc1251130e99 # v11.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          use-upper-case: true

  smoke-tests:
    name: "Build and Smoke tests"
    runs-on: ${{ matrix.os }}
    needs: [code-style]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: ansys/actions/build-wheelhouse@v11.0.2
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          operating-system: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}

  tests:
    name: "Tests"
    runs-on: ${{ matrix.os }}
    needs: [smoke-tests]
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: ansys/actions/tests-pytest@v11.0.2
        with:
          pytest-markers: '-m "not developer_only"'
          python-version: ${{ matrix.python-version }}
          use-python-cache: false
          optional-dependencies-name: additional,tests,ci_types

  doc-build:
    name: "Build documentation"
    runs-on: ubuntu-latest
    needs: [doc-style]
    steps:
      - uses: ansys/actions/doc-build@v11.0.2
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          check-links: false
          needs-quarto: true
          optional-dependencies-name: doc,ci_types

  build-library:
    name: "Build library basic example"
    runs-on: ubuntu-latest
    needs: [doc-build, tests]
    steps:
      - uses: ansys/actions/build-library@v11.0.2
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  doc-deploy-dev:
    name: "Deploy development documentation"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build-library]
    steps:
      - uses: ansys/actions/doc-deploy-dev@v11.0.2
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  release:
    name: "Release project to private, public PyPI and GitHub"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [build-library]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for trusted publishing
      contents: write # required for GitHub release upload
    steps:
      - name: "Release to the private PyPI repository"
        uses: ansys/actions/release-pypi-private@v11.0.2
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          twine-username: "__token__"
          twine-token: ${{ secrets.PYANSYS_PYPI_PRIVATE_PAT }}

      - name: "Download the library artifacts from build-library step"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.LIBRARY_NAME }}-artifacts
          path: ${{ env.LIBRARY_NAME }}-artifacts

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ${{ env.LIBRARY_NAME }}-artifacts
          skip-existing: false

      - name: "Release to GitHub"
        uses: ansys/actions/release-github@v11.0.2
        with:
          library-name: ${{ env.LIBRARY_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

  doc-deploy-stable:
    name: "Deploy stable docs"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags') && !contains(github.ref, 'dev')
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write # Needed to deploy documentation to the repository
    steps:
      - name: Deploy the stable documentation
        uses: ansys/actions/doc-deploy-stable@v11.0.2
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          render-last: "5"
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
